[package]
name = "silt-cache"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
# Optional compatibility adapter: yevm Chain impl + overlay() helper.
# Core crate must keep compiling without it (PLAN D4).
yevm = ["dep:yevm"]
# Warm partial state trie fed by the diff stream (PLAN D11); reth-free.
trie = ["dep:mpt-core", "dep:rlp"]

[dependencies]
silt-wire.workspace = true
tokio.workspace = true
eyre.workspace = true
tracing.workspace = true
futures.workspace = true
dashmap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tiny-keccak = { version = "2", features = ["keccak"] }
yevm = { workspace = true, optional = true }
mpt-core = { workspace = true, optional = true }
rlp = { workspace = true, optional = true }

[[example]]
name = "replay"
required-features = ["yevm"]

[[example]]
name = "trie-follow"
required-features = ["trie"]

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "time", "test-util"] }
