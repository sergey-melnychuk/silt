[package]
name = "silt-node"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The silt capabilities as a library any reth node installs (PLAN D7): the
# state-diff feed ExEx, the lookup fast path (D9) and `silt_multiproof`
# (D8). With silt-exex, the only crates allowed to depend on reth (D4).
[dependencies]
silt-wire.workspace = true
tokio.workspace = true
eyre.workspace = true
tracing.workspace = true
futures.workspace = true
serde.workspace = true
toml.workspace = true

reth-ethereum = { workspace = true, features = ["full"] }
alloy-primitives = { version = "1", features = ["serde"] }
# D16: decoding payload transactions exactly as reth's stock EVM config does
# (the same alloy-eips as the pinned reth).
alloy-eips = { version = "2.5", default-features = false }
# Header answers (op 5) are the RLP of reth's consensus header.
alloy-rlp = { version = "0.3", default-features = false }
# D14's pool worker lowers its own thread's CPU and I/O priority.
libc = "0.2"

# silt_multiproof (D8) rides reth's own RPC server; same jsonrpsee minor
# as the pinned reth so the build shares artifacts.
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
async-trait.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The read-only harness (examples/lookup-ro.rs) reads stage checkpoints;
# the proof tests (lookup.rs) write one.
reth-stages-types.workspace = true
# The proof tests' blocks executed but not persisted.
reth-chain-state.workspace = true
