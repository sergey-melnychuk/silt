[package]
name = "silt-node"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The silt capabilities as a library any reth node installs (PLAN D7): the
# state-diff feed ExEx, the lookup fast path (D9) and `silt_multiproof`
# (D8). With silt-exex, the only crates allowed to depend on reth (D4).
[dependencies]
silt-wire.workspace = true
tokio.workspace = true
eyre.workspace = true
tracing.workspace = true
futures.workspace = true
serde.workspace = true
toml.workspace = true

reth-ethereum = { workspace = true, features = ["full"] }
alloy-primitives = { version = "1", features = ["serde"] }

# silt_multiproof (D8) rides reth's own RPC server; same jsonrpsee minor
# as the pinned reth so the build shares artifacts.
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
async-trait.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Only the read-only harness (examples/lookup-ro.rs) reads stage checkpoints.
reth-stages-types.workspace = true
