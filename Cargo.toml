[workspace]
resolver = "3"
members = ["crates/silt-wire", "crates/silt-cache", "crates/silt-exex"]
# Plain `cargo build/test` skips the reth-heavy wrapper; scripts/ci.sh
# builds it explicitly (it pulls the full node tree and takes minutes).
default-members = ["crates/silt-wire", "crates/silt-cache"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
silt-wire = { path = "crates/silt-wire" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal"] }
eyre = "0.6"
tracing = "0.1"
dashmap = "6"
futures = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1"
async-trait = "0.1"
toml = "0.9"

# Adapter: yevm only behind silt-cache's optional `yevm` feature.
yevm = { git = "https://github.com/sergey-melnychuk/yevm.git", branch = "main" }

# Mirrors the `[patch]` section of reth v2.10.0's root Cargo.toml: Cargo
# ignores a dependency's patches, and without these reth-core resolves from
# crates.io and reth-trie-common fails to build. Re-sync on every reth bump.
# (reth's `inkwell` patch is left out: it only feeds evm2-jit, which silt
# doesn't build, so Cargo would warn "patch not used".)
[patch."https://github.com/alloy-rs/evm2"]
evm2 = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }
evm2-inspectors = { git = "https://github.com/DaniPopes/evm2", rev = "592bf18c4e22fff54ac9b4db606c4ee276e345cb" }

[patch.crates-io]
reth-codecs = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-codecs-derive = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-rpc-traits = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
reth-zstd-compressors = { git = "https://github.com/paradigmxyz/reth-core", rev = "275ce4cf5befeb9f1e8acd935ff2882d2d25fc61" }
