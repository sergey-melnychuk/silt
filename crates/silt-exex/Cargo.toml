[package]
name = "silt-exex"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Thin host binary (PLAN D7): stock reth (EthereumNode, stock CLI) with
# silt-node installed. All silt logic lives in silt-node; the reth pin is
# the workspace's (root Cargo.toml).
[dependencies]
silt-node.workspace = true
eyre.workspace = true
tracing.workspace = true
reth-ethereum = { workspace = true, features = ["full", "cli"] }
